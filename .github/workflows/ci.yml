name: CI
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v3

      # go.mod requires Go 1.26, so older versions only downloaded the
      # 1.26.0 toolchain and tested the same thing. Use the latest patch
      # release of the version go.mod declares instead.
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Go vet
        run: make vet

      - name: Go test
        run: make test

      - name: Go build
        run: make build
