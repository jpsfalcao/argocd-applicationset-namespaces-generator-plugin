apiVersion: v1
kind: Secret
metadata:
  name: argocd-applicationset-namespaces-generator-plugin
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # The server refuses to start without a token. Generate a random one, e.g.
  #   kubectl -n argocd create secret generic argocd-applicationset-namespaces-generator-plugin \
  #     --from-literal=token="$(openssl rand -hex 32)"
  # and label it app.kubernetes.io/part-of=argocd, instead of committing one here.
  token: "[REPLACE_WITH_RANDOM_TOKEN]"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-applicationset-namespaces-generator-plugin
data:
  token: '$argocd-applicationset-namespaces-generator-plugin:token'
  baseUrl: "http://argocd-applicationset-namespaces-generator-plugin:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-namespaces-generator-plugin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: argocd-applicationset-namespaces-generator-plugin
  template:
    metadata:
      labels:
        app: argocd-applicationset-namespaces-generator-plugin
    spec:
      serviceAccountName: argocd-application-controller
      automountServiceAccountToken: true
      containers:
      - name: argocd-applicationset-namespaces-generator-plugin
        image: ghcr.io/hsiaoairplane/argocd-applicationset-namespaces-generator-plugin:v1.0.1
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 128Mi
            cpu: 400m
          requests:
            memory: 64Mi
            cpu: 200m
        env:
        - name: ARGOCD_APPLICATIONSET_NAMESPACES_PLUGIN_LOG
          value: json
        - name: ARGOCD_APPLICATIONSET_NAMESPACES_PLUGIN_VERBOSITY
          value: '4'
        - name: ARGOCD_APPLICATIONSET_NAMESPACES_PLUGIN_LISTEN_TOKEN
          # Must match the one in the secret
          valueFrom:
            secretKeyRef:
              name: argocd-applicationset-namespaces-generator-plugin
              key: token
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-applicationset-namespaces-generator-plugin
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: argocd-applicationset-namespaces-generator-plugin
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-applicationset-namespaces-generator-plugin-network-policy
spec:
  egress:
  - {}
  ingress:
  # Only the ApplicationSet controller calls the plugin.
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-applicationset-controller
    ports:
    - port: 8080
  podSelector:
    matchLabels:
      app: argocd-applicationset-namespaces-generator-plugin
  policyTypes:
  - Ingress
  - Egress
